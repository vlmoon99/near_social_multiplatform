<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Near Social Multiplatform Web App" />
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Near Social Multiplatform" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Near Social Multiplatform</title>
  <link rel="manifest" href="manifest.json" />

  <script type="application/javascript" src="flutter.js" defer></script>

  <!-- near-connect: NEAR wallet connection for web auth -->
  <script type="module">
    import { NearConnector } from "https://cdn.jsdelivr.net/npm/@hot-labs/near-connect/+esm";

    const connector = new NearConnector();

    window.nearConnectWallet = function () {
      return new Promise((resolve, reject) => {
        const onSignIn = (event) => {
          connector.off("wallet:signIn", onSignIn);
          if (event.success && event.accounts && event.accounts.length > 0) {
            const account = event.accounts[0];
            resolve(JSON.stringify({
              accountId: account.accountId,
              publicKey: account.publicKey || null,
            }));
          } else {
            reject(new Error("Wallet connection failed"));
          }
        };

        connector.on("wallet:signIn", onSignIn);
        connector.connect().catch((err) => {
          connector.off("wallet:signIn", onSignIn);
          reject(err);
        });
      });
    };

    window.nearConnectDisconnect = async function () {
      try {
        await connector.disconnect();
      } catch (_) {}
    };

    window.nearConnectSignMessage = async function (message, recipient) {
      const wallet = await connector.wallet();
      const nonce = crypto.getRandomValues(new Uint8Array(32));
      const result = await wallet.signMessage({ message, recipient, nonce });
      return JSON.stringify({
        signature: result.signature,
        publicKey: result.publicKey,
        accountId: result.accountId,
        nonce: btoa(String.fromCharCode(...nonce)),
      });
    };
  </script>

</head>

<body>
  <style>
    .firebase-emulator-warning {
      display: none;
    }
  </style>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load();
  </script>
</body>

</html>
