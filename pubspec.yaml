name: near_social_mobile
description: "Multiplatform client for Near Social."
publish_to: "none"
version: 1.0.7

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: 3.4.1
  collection: 1.19.1
  connectivity_plus: 7.0.0
  crypto: 3.0.7
  cupertino_icons: 1.0.8
  dio: 5.9.0
  dio_smart_retry: 6.0.0
  easy_localization: 3.0.8
  equatable: 2.0.8
  flutter_cache_manager: 3.4.1
  flutter_jailbreak_detection: 1.10.0
  flutter_markdown_plus: 1.0.7
  flutter_riverpod: 3.0.3
  flutter_screenutil: 5.9.3
  flutter_secure_storage: 10.0.0
  flutter_staggered_grid_view: 0.7.0
  flutter_svg: 2.2.3
  freezed_annotation: 3.1.0
  go_router: 17.1.0
  google_fonts: 8.0.0
  html: 0.15.6
  image_picker: 1.2.1
  intl: 0.20.2
  json_annotation: 4.9.0
  local_auth: 2.3.0
  mobile_scanner: 7.1.4
  permission_handler: 12.0.1
  photo_view: 0.15.0
  pinenacl: 0.6.0
  pointycastle: 3.9.1
  qr_flutter: 4.1.0
  riverpod_annotation: 3.0.3
  tap_debouncer: 2.2.0
  url_launcher: 6.3.2

dev_dependencies:
  build_runner: 2.10.5
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.3
  json_serializable: 6.11.2
  mockito: 5.6.3
  riverpod_generator: 3.0.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/media/icons/logo_icon.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/media/icons/logo_icon.png"
    background_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/media/icons/
    - assets/media/images/
